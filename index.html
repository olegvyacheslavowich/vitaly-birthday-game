<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Забег Виталия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: full-bleed canvas game, HUD pinned to top, overlays as centered cards. Four levels = four seasons of Vitaly's year. Single deliberate look, works on any host theme. */
:root {
  --ink: #17262f;
  --snow: #f6f8fb;
  --gift: #e8443a;
  --ribbon: #ffd23f;
  --card: rgba(255, 255, 255, 0.93);
  --muted: #4c6170;
  --track: #dfe7ee;
  --f-display: "Rubik Mono One", "Rubik", "Arial Black", system-ui, sans-serif;
  --f-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: #8fb8de;
  color: var(--ink);
  font-family: var(--f-body);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
#stage { position: fixed; inset: 0; }
#game, #confetti { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#confetti { pointer-events: none; z-index: 30; }

.hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  z-index: 10;
}
.pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border-radius: 999px;
  padding: 7px 11px;
  box-shadow: 0 2px 0 rgba(23, 38, 47, 0.15);
  height: 36px;
}
.meter { flex: 1; min-width: 0; }
.lvl { font-family: var(--f-display); font-size: 11px; letter-spacing: .04em; white-space: nowrap; }
.bar { flex: 1; min-width: 30px; height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gift); border-radius: inherit; }
.count { font-family: var(--f-display); font-size: 13px; font-variant-numeric: tabular-nums; }
.lives span { font-size: 14px; line-height: 1; color: var(--gift); }
.lives span.off { color: #c9d3db; }
.icon-btn {
  pointer-events: auto;
  width: 36px; height: 36px; flex: none;
  border: 0; border-radius: 50%;
  background: var(--card);
  color: var(--ink);
  font-size: 16px;
  box-shadow: 0 2px 0 rgba(23, 38, 47, 0.15);
  cursor: pointer;
}
.icon-btn:focus-visible, .btn:focus-visible { outline: 3px solid var(--ribbon); outline-offset: 2px; }

.toast {
  position: absolute;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 62px);
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  background: var(--ink);
  color: var(--snow);
  font-weight: 600;
  font-size: 15px;
  text-align: center;
  padding: 9px 15px;
  border-radius: 14px;
  z-index: 11;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

.overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(23, 38, 47, 0.3);
  overflow-y: auto;
}
.card {
  width: 100%;
  max-width: 380px;
  margin: auto;
  flex: none;
  background: var(--card);
  border-radius: 22px;
  padding: 24px 22px 22px;
  text-align: center;
  display: grid;
  gap: 13px;
  justify-items: center;
  box-shadow: 0 10px 30px rgba(23, 38, 47, 0.25);
}
.portrait {
  width: 88px; height: 120px;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  filter: drop-shadow(0 4px 0 rgba(23, 38, 47, 0.18));
}
.eyebrow { font-family: var(--f-display); font-size: 11px; letter-spacing: .12em; color: var(--gift); text-transform: uppercase; }
.card h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 400;
  font-size: clamp(22px, 6.4vw, 30px);
  line-height: 1.1;
  text-wrap: balance;
}
.card p { margin: 0; font-size: 16px; line-height: 1.45; color: var(--muted); text-wrap: pretty; max-width: 32ch; }
.card .hint { font-size: 13px; line-height: 1.4; color: var(--ink); background: #eef3f7; border-radius: 10px; padding: 8px 12px; }
.levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.levels span { font-size: 12px; font-weight: 600; background: #eef3f7; border-radius: 999px; padding: 4px 10px; }
.btn {
  appearance: none;
  border: 0;
  background: var(--gift);
  color: #fff;
  font-family: var(--f-display);
  font-size: 16px;
  letter-spacing: .02em;
  padding: 15px 26px;
  border-radius: 16px;
  box-shadow: 0 4px 0 #a92a22;
  cursor: pointer;
  min-width: 200px;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a92a22; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: none; font-family: var(--f-body); font-weight: 600; font-size: 15px; padding: 8px 12px; min-width: 0; text-decoration: underline; text-underline-offset: 3px; }
.btn[disabled] { background: #b9c6d0; box-shadow: 0 4px 0 #8fa0ad; cursor: default; }
.win-card .portrait { width: 70px; height: 96px; }
.age {
  font-family: var(--f-display);
  font-size: 56px;
  line-height: 1;
  color: var(--gift);
  text-shadow: 0 4px 0 var(--ribbon);
}
.stat { font-size: 13px; font-weight: 600; color: var(--muted); }
.brief {
  width: 100%;
  text-align: left;
  background: #f3f6f9;
  border: 1.5px dashed #b9c6d0;
  border-radius: 14px;
  padding: 14px 14px 12px;
  display: grid;
  gap: 8px;
}
.brief-title { font-family: var(--f-display); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.brief-meta { font-size: 12px; color: var(--muted); }
.brief ol { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 14.5px; line-height: 1.4; }
.brief ol li::marker { font-weight: 800; color: var(--gift); }
.brief-terms { font-size: 12.5px; color: var(--muted); border-top: 1px solid #dbe3ea; padding-top: 8px; }
.stamp {
  justify-self: end;
  font-family: var(--f-display);
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--gift);
  border: 2px solid var(--gift);
  border-radius: 8px;
  padding: 5px 9px;
  transform: rotate(-4deg);
  text-transform: uppercase;
  text-align: center;
  line-height: 1.35;
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<div id="stage">
  <canvas id="game" aria-label="Игра: забег Виталия в четыре уровня"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="pill meter" aria-label="Прогресс уровня">
      <span class="lvl" id="lvl">1/4</span>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <div class="pill" aria-label="Подарки">
      <svg width="18" height="18" viewBox="0 0 22 22" aria-hidden="true"><rect x="2" y="8" width="18" height="12" rx="2" fill="#e8443a"/><rect x="1" y="5" width="20" height="5" rx="1.5" fill="#f2655b"/><rect x="9.5" y="5" width="3" height="15" fill="#ffd23f"/><path d="M11 5 C7 0 3 3 7 5 Z M11 5 C15 0 19 3 15 5 Z" fill="#ffd23f"/></svg>
      <span class="count" id="count">0</span>
    </div>
    <div class="pill lives" id="lives" aria-label="Жизни"></div>
    <button class="icon-btn" id="mute" type="button" aria-label="Выключить звук">♪</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <div class="portrait"></div>
      <h1>Забег Виталия</h1>
      <p id="startText"></p>
      <div class="levels"><span>Асбест</span><span>Участок</span><span>Дрифт</span><span>Горка</span></div>
      <button class="btn" id="startBtn" type="button">Погнали</button>
    </div>
  </div>

  <div class="overlay" id="introScreen" hidden>
    <div class="card">
      <div class="eyebrow" id="introEyebrow">Уровень 2 из 4</div>
      <h1 id="introTitle">Участок</h1>
      <p id="introText"></p>
      <div class="hint" id="introHint"></div>
      <button class="btn" id="introBtn" type="button">Поехали</button>
    </div>
  </div>

  <div class="overlay" id="overScreen" hidden>
    <div class="card">
      <h1>Ой!</h1>
      <p id="overText"></p>
      <button class="btn" id="retryBtn" type="button">Повторить уровень</button>
    </div>
  </div>

  <div class="overlay" id="winScreen" hidden>
    <div class="card win-card">
      <div class="portrait"></div>
      <h1 id="winTitle">С днём рождения, Виталий!</h1>
      <div class="age" id="age" hidden></div>
      <div class="stat" id="stat"></div>
      <div class="brief">
        <div class="brief-title" id="briefTitle"></div>
        <div class="brief-meta" id="briefMeta"></div>
        <ol id="briefItems"></ol>
        <div class="brief-terms" id="briefTerms"></div>
        <div class="stamp" id="stamp"></div>
      </div>
      <button class="btn ghost" id="againBtn" type="button">Пройти ещё раз</button>
    </div>
  </div>

</div>

  }

    return actx;
  }
  function tone(freq, dur, type = "square", vol = 0.06, slide = 0) {

    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }

  // Асбест, зимний день: отвалы карьера, панельки, снег

  function drawRunner(R) {

    ctx.fillStyle = "rgba(23,38,47,.18)"; ctx.beginPath(); ctx.ellipse(P.x, groundY + 3, 16 * sh, 4 * sh, 0, 0, TAU); ctx.fill();
    if (blink) return;

    ctx.save(); ctx.translate(P.x, gy);
    if (R.flip) { ctx.translate(0, -50); ctx.rotate(R.flip); ctx.translate(0, 50); }
    ctx.scale(1 + sq, 1 - sq);

      ctx.beginPath(); ctx.ellipse(0, -50, 42, 58, 0, 0, TAU); ctx.fill();

    ctx.strokeStyle = "#20323c"; ctx.lineWidth = 6; ctx.lineCap = "round";

    ctx.fillStyle = R.jacket; rr(-13, -P.bodyH - bob, 26, 22, 8); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.15)"; ctx.fillRect(-1, -P.bodyH - bob + 3, 2, 18);
    ctx.strokeStyle = R.jacket; ctx.lineWidth = 6;

    ctx.beginPath(); ctx.moveTo(-10, -P.bodyH + 6 - bob); ctx.lineTo(-14 + arm * 6, -P.bodyH + 18 - bob - (air ? 12 : 0)); ctx.stroke();
    const hx = 14 - arm * 6, hy2 = -P.bodyH + 18 - bob - (air ? 12 : 0);

    ctx.restore();

      ctx.fillStyle = "#3a4f8a"; ctx.fillRect(x + i * 12 - 2, b - 64, 4, 14);
      ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.ellipse(x + i * 12, b - 69 + Math.sin(G.t * 18 + i) * 0.5, 3.2, 5.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,210,63,.25)"; ctx.beginPath(); ctx.arc(x + i * 12, b - 69, 10, 0, TAU); ctx.fill();
    }
  }
  function bubble(x, y, text) {
    ctx.font = `600 12px "Rubik", system-ui, sans-serif`;
    const w = ctx.measureText(text).width + 16;
    ctx.fillStyle = "#fff"; rr(x - w / 2, y - 24, w, 22, 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 4, y - 3); ctx.lineTo(x + 4, y - 3); ctx.lineTo(x, y + 4); ctx.fill();
    ctx.fillStyle = "#17262f"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, x, y - 13);
  }
  function drawPerson(x, h, coat, hat, wave, hair) {
    const y = groundY, s = h / 100;
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = "rgba(10,20,40,.25)"; ctx.beginPath(); ctx.ellipse(0, 2, 16, 4, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#20323c"; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-5, -30); ctx.lineTo(-6, -2); ctx.moveTo(5, -30); ctx.lineTo(6, -2); ctx.stroke();
    ctx.fillStyle = coat; rr(-15, -68, 30, 42, 10); ctx.fill();
    ctx.strokeStyle = coat; ctx.lineWidth = 7;
    const a = wave ? Math.sin(G.t * 8) * 0.5 : 0;
    ctx.beginPath(); ctx.moveTo(-12, -62); ctx.lineTo(-20, -40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -62); ctx.lineTo(12 + Math.cos(-1.2 + a) * 22, -62 + Math.sin(-1.2 + a) * 22); ctx.stroke();
    if (hair) { ctx.fillStyle = hair; rr(-14, -86, 28, 30, 10); ctx.fill(); }
    ctx.fillStyle = "#f1c9a8"; ctx.beginPath(); ctx.arc(0, -80, 13, 0, TAU); ctx.fill();
    ctx.fillStyle = "#17262f"; ctx.beginPath(); ctx.arc(-4, -81, 1.6, 0, TAU); ctx.arc(4, -81, 1.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#17262f"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(0, -77, 4, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.fillStyle = hat; ctx.beginPath(); ctx.arc(0, -84, 14, Math.PI, TAU); ctx.fill(); ctx.fillRect(-14, -86, 28, 5);
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, -99, 5, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawKmPost(x, n) {
    const y = groundY;
    ctx.fillStyle = "#ffffff"; rr(x - 13, y - 60, 26, 60, 3); ctx.fill();
    ctx.fillStyle = "#17262f"; ctx.fillRect(x - 13, y - 14, 26, 6);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = `14px ${FONT}`;
    ctx.fillText(String(n), x, y - 38);
  }

  /* =====================================================================
     УРОВНИ 1, 2, 4: БЕГ
     ===================================================================== */
  function makeRunner(kind) {
    const conf = {
      asbest: { length: 6200, v0: 210, v1: 270, jacket: "#1f4a4f", bg: bgAsbest },
      dacha: { length: 7000, v0: 220, v1: 285, jacket: "#3b5a8a", bg: bgDacha },
      hill: { length: 3600, v0: 260, v1: 360, jacket: "#1f4a4f", bg: bgHill },
    }[kind];
    const R = {
      kind, conf, dist: 0, speed: conf.v0, y: 0, vy: 0, onGround: true, jumps: 0, runPhase: 0, squash: 0,
      flip: 0, flipping: false, drill: 0, obstacles: [], items: [], props: [], nextSpawn: kind === "hill" ? 300 : 460, n: 0,
      finishing: false, finishProp: null, tilt: kind === "hill" ? 0.17 : 0, jacket: conf.jacket, done: false, parkour: false, saltoShown: false,
    };
    if (kind === "asbest") R.props.push({ type: "city", x: 260 });

    function spawn() {
      const x = VW + 40;
      R.n++;
      if (kind === "asbest") {
        const label = CONFIG.asbestObstacles[(R.n - 1) % CONFIG.asbestObstacles.length];
        const lines = labelLines(label);
        ctx.font = `11px ${FONT}`;
        const w = clamp(Math.max(...lines.map((l) => ctx.measureText(l).width)) + 16, 44, 108);
        const h = lines.length > 1 ? 52 : rand(40, 50);
        R.obstacles.push({ type: "sign", x, w, h, lines, hue: R.n % 2 });
        giftPattern(x, w, h);
        R.nextSpawn = R.dist + rand(300, 470) + w;
      } else if (kind === "dacha") {
        if (R.n === 2 || R.n === 9) { R.items.push({ kind: "drill", x: x + 20, y: groundY - 70 }); R.nextSpawn = R.dist + 220; return; }
        if (R.n % 4 === 0) {
          R.props.push({ type: "swing", x, used: false });
          for (let i = 0; i < 5; i++) {
            const o = 60 + i * 45, tt = (o - 20) / R.speed;
            R.items.push({ kind: "gift", x: x + o, y: groundY - (960 * tt - 1000 * tt * tt) - 45 });
          }
          R.nextSpawn = R.dist + 560; return;
        }
        const t = pick(["planks", "stump", "barrow", "roll"]);
        const dims = { planks: [70, 40], stump: [38, 34], barrow: [64, 34], roll: [54, 30] }[t];
        R.obstacles.push({ type: t, x, w: dims[0], h: dims[1] });
        giftPattern(x, dims[0], dims[1]);
        R.nextSpawn = R.dist + rand(280, 440) + dims[0];
      } else {
        const w = rand(46, 64), h = rand(16, 24);
        R.obstacles.push({ type: "bump", x, w, h, soft: true });
        for (let i = 0; i < 3; i++) R.items.push({ kind: "gift", x: x + w / 2 + (i - 1) * 34, y: groundY - h - 60 - (i === 1 ? 24 : 0) });
        R.nextSpawn = R.dist + rand(320, 460);
      }
    }
    function giftPattern(x, w, h) {
      const r = Math.random();
      if (r < 0.55) for (let i = -1; i <= 1; i++) R.items.push({ kind: "gift", x: x + w / 2 + i * 38, y: groundY - h - 52 - (i === 0 ? 28 : 6) });
      else if (r < 0.85) { R.items.push({ kind: "gift", x: x - 120, y: groundY - 24 }); R.items.push({ kind: "gift", x: x - 82, y: groundY - 24 }); }
      else R.items.push({ kind: "gift", x: x + w + 120, y: groundY - 150 });
    }
    function hitbox() {
      const top = groundY + R.y - P.bodyH - P.headH + 14;
      return { x: P.x - P.w / 2, y: top, w: P.w, h: groundY + R.y - top };
    }
    function puff(y, n) {
      if (reduceMotion) return;
      const c = kind === "dacha" ? "#cfe8b8" : "#ffffff";
      for (let i = 0; i < n; i++) G.particles.push({ x: P.x, y: y - 2, vx: rand(-120, -40), vy: rand(-90, -30), life: 0.5, max: 0.5, c, s: 5 });
    }

    return {
      kind,
      progress: () => R.dist / conf.length,
      press() {
        if (R.done || (R.finishing && kind === "hill" && R.speed < 40)) return;
        if (R.onGround) { R.vy = kind === "hill" ? -620 : -720; R.onGround = false; R.jumps = 1; R.squash = 1; sfx.jump(); puff(groundY, 6); }
        else if (R.jumps < 2 && kind !== "hill") {
          R.vy = -600; R.jumps = 2; sfx.jump2(); puff(groundY + R.y, 5);
          if (!R.parkour && kind === "asbest") { R.parkour = true; toast(CONFIG.doubleJumpPhrase); }
        }
      },
      release() {},
      update(dt) {
        R.mult = Math.min(1, (R.mult ?? 1) + dt * 0.6);
        if (!R.finishing) R.speed = Math.min(conf.v1, conf.v0 + R.dist / 40) * R.mult;
        if (R.finishing && R.finishProp && kind === "hill") {
          const d = R.finishProp.x - P.x - 70;
          R.speed = Math.max(0, Math.min(R.speed, d * 2.5));
          R.tilt = 0.17 * clamp((R.finishProp.x - P.x - 80) / 500, 0, 1);
        }
        const dx = R.speed * dt;
        R.dist += dx; R.runPhase += dt * R.speed / 22; R.squash = Math.max(0, R.squash - dt * 5);
        R.vy += 2000 * dt; R.y += R.vy * dt;
        if (R.flipping) R.flip += dt * TAU / 0.9;
        if (R.y >= 0) {
          if (!R.onGround && R.vy > 300) { R.squash = 0.8; puff(groundY, 4); }
          R.y = 0; R.vy = 0; R.onGround = true; R.jumps = 0; R.flipping = false; R.flip = 0;
        }
        if (R.drill > 0) { R.drill -= dt; if (R.drill <= 0) toast("Аккумулятор сел"); }

        if (!R.finishing && R.dist >= R.nextSpawn) spawn();
        if (!R.finishing && R.dist >= conf.length) {
          R.finishing = true;
          const fx0 = VW + 80;
          if (kind === "asbest") R.finishProp = { type: "cityEnd", x: fx0 };
          else if (kind === "dacha") R.finishProp = { type: "car", x: fx0 + 40 };
          else { R.finishProp = { type: "family", x: fx0 + 160 }; toast("Внизу ждут!"); }
          R.props.push(R.finishProp);
        }
        for (const o of R.obstacles) o.x -= dx;
        for (const it of R.items) it.x -= dx;
        for (const p of R.props) p.x -= dx;
        R.obstacles = R.obstacles.filter((o) => o.x + o.w > -60 && !o.gone);
        R.items = R.items.filter((it) => it.x > -40 && !it.gone);
        R.props = R.props.filter((p) => p.x > -200);

        const hb = hitbox();
        for (const o of R.obstacles) {
          if (o.broken) continue;
          if (!overlap(hb, { x: o.x + 4, y: groundY - o.h + 4, w: o.w - 8, h: o.h })) continue;
          if (R.drill > 0) {
            o.broken = true; o.gone = true; sfx.smash(); G.shake = reduceMotion ? 0 : 0.15; addGift(o.x + o.w / 2, groundY - o.h);
            if (!reduceMotion) for (let i = 0; i < 12; i++) G.particles.push({ x: o.x + o.w / 2, y: groundY - o.h / 2, vx: rand(-60, 220), vy: rand(-260, -60), life: 0.8, max: 0.8, c: i % 2 ? "#c58d52" : "#7a5132", s: 6 });
          } else if (o.soft) {
            if (!o.hit) { o.hit = true; sfx.bump(); R.mult = 0.65; toast(pick(["Бух!", "Кочка!", "Ух!"]), 700); }
          } else if (hurt(CONFIG.hitPhrases)) { if (state !== "play") return; }
        }
        for (const it of R.items) {
          if (it.got) { it.t += dt; if (it.t > 0.35) it.gone = true; continue; }
          const box = it.kind === "drill" ? { x: it.x - 18, y: it.y - 18, w: 36, h: 36 } : { x: it.x - 13, y: it.y - 13, w: 26, h: 26 };
          if (overlap(hb, box)) {
            it.got = true; it.t = 0;
            if (it.kind === "drill") { R.drill = 6; sfx.power(); toast("Шуруповёрт! 6 секунд ломай всё"); }
            else addGift(it.x, it.y);
          }
        }
        for (const p of R.props) {
          if (p.type === "swing" && !p.used && P.x > p.x + 18 && P.x < p.x + 64 && R.y > -30) {
            p.used = true; R.vy = -960; R.onGround = false; R.jumps = 2; R.flipping = true; R.flip = 0; sfx.launch();
            if (!R.saltoShown) { R.saltoShown = true; toast("Сальто! Паркур не пропьёшь"); }
          }
        }
        const fp = R.finishProp;
        if (fp && !R.done) {
          if (kind === "asbest" && fp.x < P.x - 10) { R.done = true; levelDone(); }
          if (kind === "dacha" && fp.x - P.x < 30 && R.onGround) { R.done = true; levelDone(); }
          if (kind === "hill" && fp.x - P.x - 70 < 4) { R.done = true; sfx.level(); setTimeout(() => { if (state === "play" && LV && LV.kind === "hill") win(); }, 2200); }
        }
        if (G.inv > 0) G.inv -= dt;
        stepParticles(dt);
      },
      draw() {
        conf.bg(R.dist);
        if (R.tilt) {
          ctx.save(); ctx.translate(P.x, groundY); ctx.rotate(R.tilt); ctx.translate(-P.x, -groundY);
          ctx.fillStyle = "#eef3fa"; ctx.fillRect(-VW, groundY - 4, VW * 4, VH * 2);
          ctx.fillStyle = "#d3deee"; tiles(R.dist, 90, (x) => ctx.fillRect(x, groundY + 16, 50, 3));
          ctx.fillStyle = "#b8c8e2"; tiles(R.dist, 140, (x) => ctx.fillRect(x + 30, groundY + 34, 34, 3));
        } else if (kind === "hill") {
          ctx.fillStyle = "#eef3fa"; ctx.fillRect(-10, groundY - 4, VW + 20, VH);
        }
        for (const p of R.props) {
          if (p.type === "city") drawCitySign(p.x, false);
          if (p.type === "cityEnd") drawCitySign(p.x, true);
          if (p.type === "swing") drawSwing(p);
          if (p.type === "car") drawParkedCar(p.x);
          if (p.type === "family") {
            drawCake(p.x);
            drawKmPost(p.x + 146, CONFIG.age);
            drawPerson(p.x + 62, 96, "#8b2f4a", "#e6e1d6", true, "#6b4426");
            drawPerson(p.x + 104, 52, "#ff8fb1", "#ffd23f", true, null);
            if (p.x < VW - 60) { bubble(p.x + 62, groundY - 104, "С днём рождения!"); bubble(p.x + 104, groundY - 60, "Папа!"); }
          }
        }
        for (const o of R.obstacles) drawObstacle(o);
        for (const it of R.items) {
          const bob = Math.sin(G.t * 4 + it.x * 0.05) * 3;
          if (it.kind === "drill") {
            if (!it.got) { ctx.fillStyle = "rgba(255,207,46,.35)"; ctx.beginPath(); ctx.arc(it.x, it.y + bob, 20, 0, TAU); ctx.fill(); drawDrill(it.x - 4, it.y + bob, 1.3); }
          } else if (it.got) drawGift(it.x, it.y - it.t * 60, 1 + it.t * 1.5, 1 - it.t / 0.35);
          else drawGift(it.x, it.y + bob);
        }
        if (kind === "hill") drawSledder(R); else drawRunner(R);
        drawParticles();
        if (R.tilt) ctx.restore();
        if (R.drill > 0) {
          const by = groundY + R.y - 128;
          ctx.fillStyle = "rgba(23,38,47,.75)"; rr(P.x - 26, by, 52, 9, 4); ctx.fill();
          ctx.fillStyle = "#ffcf2e"; rr(P.x - 24, by + 2, 48 * (R.drill / 6), 5, 2); ctx.fill();
        }
      },
    };
  }

  /* =====================================================================
     УРОВЕНЬ 3: ДРИФТ (вид сверху)
     ===================================================================== */
  function makeDrift() {
    const D = { dist: 0, speed: 290, length: 8600, x: 0, vx: 0, ang: 0, gates: [], items: [], marks: [], nextGate: 520, lastGx: 0, finish: null, done: false, streak: 0, edgeT: 0 };
    const RW = () => Math.min(VW - 40, 330);
    const carY = () => VH * 0.72;
    const sy = (wy) => carY() - (wy - D.dist);

    function spawnGate() {
      const half = RW() / 2 - 70;
      const gx = clamp(D.lastGx + rand(-150, 150), -half, half);
      D.lastGx = gx;
      const gap = Math.max(96, 128 - D.dist / 260);
      const wy = D.dist + VH;
      D.gates.push({ wy, gx, gap, passed: false, hit: false });
      D.items.push({ wy, gx, got: false });
      D.nextGate = D.dist + rand(270, 340);
    }

    return {
      kind: "drift",
      progress: () => D.dist / D.length,
      press() {}, release() {},
      update(dt) {
        D.speed = Math.min(360, 290 + D.dist / 80);
        D.dist += D.speed * dt;
        const ax = pressed ? 1150 : -1150;
        D.vx = clamp(D.vx + ax * dt, -290, 290);
        D.x += D.vx * dt;
        D.ang += ((D.vx / 290) * 0.55 - D.ang) * Math.min(1, dt * 8);
        const lim = RW() / 2 - 20;
        D.edgeT -= dt;
        if (Math.abs(D.x) > lim) { D.x = Math.sign(D.x) * lim; D.vx *= -0.35; if (D.edgeT <= 0) { toast("Обочина!", 600); sfx.bump(); D.edgeT = 1.5; } }

        if (!D.finish && D.dist >= D.nextGate && D.dist < D.length - VH) spawnGate();
        if (!D.finish && D.dist >= D.length - VH) D.finish = { wy: D.dist + VH + 40 };

        const cx = VW / 2 + D.x, cy = carY();
        for (const g of D.gates) {
          const y = sy(g.wy);
          for (const side of [-1, 1]) {
            const kx = VW / 2 + g.gx + side * g.gap / 2;
            if (!g.hit && Math.hypot(kx - cx, y - cy) < 24) {
              g.hit = true; D.streak = 0; g.flyX = side;
              if (hurt(CONFIG.driftHitPhrases) && state !== "play") return;
            }
          }
          if (!g.passed && y > cy + 30) {
            g.passed = true;
            if (!g.hit) { D.streak++; if (D.streak % 6 === 0) toast(pick(["Красивый занос!", "Чисто прошёл!", "Боком — как надо"])); }
          }
        }
        for (const it of D.items) {
          if (it.got) continue;
          const y = sy(it.wy), x = VW / 2 + it.gx;
          if (Math.hypot(x - cx, y - cy) < 26) { it.got = true; addGift(x, y); }
        }
        D.gates = D.gates.filter((g) => sy(g.wy) < VH + 60);
        D.items = D.items.filter((it) => sy(it.wy) < VH + 60 && !it.got);

        // дым и следы шин
        if (Math.abs(D.vx) > 130) {
          const back = 24;
          for (const s of [-1, 1]) {
            const rx = cx + s * 13 * Math.cos(D.ang) - Math.sin(D.ang) * back;
            const ry = cy + s * 13 * Math.sin(D.ang) + Math.cos(D.ang) * back;
            D.marks.push({ x: rx, wy: D.dist - (ry - cy) });
            if (!reduceMotion && Math.random() < 0.6) G.particles.push({ x: rx, y: ry, vx: rand(-30, 30) - D.vx * 0.2, vy: rand(-10, 20), life: 0.7, max: 0.7, c: "#d9dde2", s: 5, smoke: true });
          }
        }
        if (D.marks.length > 500) D.marks.splice(0, D.marks.length - 500);
        if (D.finish && !D.done && sy(D.finish.wy) > cy) { D.done = true; levelDone(); }
        if (G.inv > 0) G.inv -= dt;
        stepParticles(dt, D.speed);
      },
      draw() {
        const rw = RW(), cxr = VW / 2, cy = carY();
        // трава с листьями
        ctx.fillStyle = "#6e7d3a"; ctx.fillRect(-10, -10, VW + 20, VH + 20);
        for (const l of leaves) {
          const per = VH + 200, y = ((l.y / 900) * per + D.dist) % per - 100;
          const x = l.x < 0.5 ? l.x * 2 * (cxr - rw / 2 - 10) : cxr + rw / 2 + 10 + (l.x - 0.5) * 2 * (VW - cxr - rw / 2 - 10);
          ctx.fillStyle = l.c; ctx.beginPath(); ctx.ellipse(x, y, 4, 2.5, l.x * 6, 0, TAU); ctx.fill();
        }
        // асфальт
        ctx.fillStyle = "#3b4048"; ctx.fillRect(cxr - rw / 2, -10, rw, VH + 20);
        ctx.fillStyle = "#e9ecef"; ctx.fillRect(cxr - rw / 2, -10, 4, VH + 20); ctx.fillRect(cxr + rw / 2 - 4, -10, 4, VH + 20);
        ctx.fillStyle = "rgba(255,255,255,.55)";
        const off = ((D.dist % 60) + 60) % 60;
        for (let y = -60 + off; y < VH + 60; y += 60) ctx.fillRect(cxr - 2, y, 4, 30);
        // следы шин
        ctx.fillStyle = "rgba(20,22,26,.35)";
        for (const m of D.marks) { const y = sy(m.wy); if (y > -10 && y < VH + 10) ctx.fillRect(m.x - 2, y - 2, 4, 4); }
        // фонари
        const lo = ((D.dist % 300) + 300) % 300;
        for (let y = -300 + lo; y < VH + 300; y += 300) for (const s of [-1, 1]) {
          const x = cxr + s * (rw / 2 + 14);
          const g = ctx.createRadialGradient(x - s * 30, y, 4, x - s * 30, y, 90);
          g.addColorStop(0, "rgba(255,214,140,.35)"); g.addColorStop(1, "rgba(255,214,140,0)");
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x - s * 30, y, 90, 0, TAU); ctx.fill();
          ctx.fillStyle = "#2b2f36"; ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
          ctx.fillStyle = "#ffe0a0"; ctx.beginPath(); ctx.arc(x - s * 18, y, 4, 0, TAU); ctx.fill();
        }
        // финиш
        if (D.finish) {
          const y = sy(D.finish.wy);
          for (let i = 0; i < rw / 12; i++) for (let j = 0; j < 2; j++) {
            ctx.fillStyle = (i + j) % 2 ? "#17262f" : "#ffffff"; ctx.fillRect(cxr - rw / 2 + i * 12, y + j * 12, 12, 12);
          }
        }
        // подарки и конусы
        for (const it of D.items) drawGift(VW / 2 + it.gx, sy(it.wy) + Math.sin(G.t * 4 + it.wy) * 2);
        for (const g of D.gates) {
          const y = sy(g.wy);
          for (const side of [-1, 1]) {
            let x = VW / 2 + g.gx + side * g.gap / 2, yy = y;
            if (g.hit && g.flyX === side) { x += side * 16; yy -= 6; }
            ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.arc(x + 2, yy + 3, 10, 0, TAU); ctx.fill();
            ctx.fillStyle = "#ff7a1a"; ctx.beginPath(); ctx.arc(x, yy, 10, 0, TAU); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, yy, 6, 0, TAU); ctx.fill();
            ctx.fillStyle = "#ff7a1a"; ctx.beginPath(); ctx.arc(x, yy, 3, 0, TAU); ctx.fill();
          }
        }
        drawParticles();
        // машина
        const blink = G.inv > 0 && Math.floor(G.inv * 12) % 2 === 0;
        if (!blink) {
          const cx = VW / 2 + D.x;
          ctx.save(); ctx.translate(cx, cy); ctx.rotate(D.ang);
          const beam = ctx.createLinearGradient(0, -30, 0, -170);
          beam.addColorStop(0, "rgba(255,236,170,.45)"); beam.addColorStop(1, "rgba(255,236,170,0)");
          ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(-14, -30); ctx.lineTo(-48, -170); ctx.lineTo(48, -170); ctx.lineTo(14, -30); ctx.closePath(); ctx.fill();
          ctx.fillStyle = "rgba(0,0,0,.3)"; rr(-17, -27, 38, 62, 10); ctx.fill();
          ctx.fillStyle = "#111"; for (const [wx, wy] of [[-19, -20], [13, -20], [-19, 12], [13, 12]]) { rr(wx, wy, 6, 14, 2); ctx.fill(); }
          ctx.fillStyle = "#d8342c"; rr(-17, -31, 34, 62, 10); ctx.fill();
          ctx.fillStyle = "#b9261f"; rr(-13, -29, 26, 10, 5); ctx.fill();
          ctx.fillStyle = "#1d2a3a"; rr(-13, -17, 26, 10, 3); ctx.fill(); rr(-12, 16, 24, 7, 3); ctx.fill();
          ctx.save(); ctx.beginPath(); ctx.ellipse(0, 4, 10, 11, 0, 0, TAU); ctx.clip();
          if (face.complete && face.naturalWidth) ctx.drawImage(face, -11, -9, 22, 30); ctx.restore();
          ctx.strokeStyle = "#1d2a3a"; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 4, 10, 11, 0, 0, TAU); ctx.stroke();
          ctx.fillStyle = "#ffe48a"; ctx.fillRect(-15, -31, 7, 4); ctx.fillRect(8, -31, 7, 4);
          ctx.fillStyle = "#ff3b30"; ctx.fillRect(-15, 28, 7, 3); ctx.fillRect(8, 28, 7, 3);
          ctx.restore();
        }
        // подсказка в начале
        if (D.dist < 900) {
          ctx.globalAlpha = clamp((900 - D.dist) / 300, 0, 1);
          ctx.fillStyle = "rgba(23,38,47,.8)"; rr(VW / 2 - 130, cy + 50, 260, 34, 12); ctx.fill();
          ctx.fillStyle = "#fff"; ctx.font = `600 13px "Rubik", system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(pressed ? "Держишь — заносит вправо" : "Отпустил — заносит влево", VW / 2, cy + 67);
          ctx.globalAlpha = 1;
        }
      },
    };
  }

  /* =====================================================================
     ПОТОК ИГРЫ
     ===================================================================== */
  function show(id, on) { $(id).hidden = !on; }
  function hideOverlays() { ["startScreen", "introScreen", "overScreen", "winScreen"].forEach((id) => show(id, false)); }

  function makeLevel(i) { return i === 2 ? makeDrift() : makeRunner(["asbest", "dacha", null, "hill"][i]); }

  function startLevel(i) {
    audioCtx();
    G.level = i; G.giftsAtStart = G.gifts;
    G.maxLives = G.fails[i] >= 2 ? 5 : 3; G.lives = G.maxLives; G.inv = 0; G.shake = 0; G.particles = [];
    LV = makeLevel(i);
    pressed = false; stopConfetti();
    hideOverlays(); show("hud", true);
    $("lvl").textContent = `${i + 1}/4`;
    renderLives(); renderCount(); renderProgress(0);
    state = "play";
    toast(`${CONFIG.levels[i].title}`, 1000);
  }
  function showIntro(i) {
    state = "intro";
    G.level = i;
    LV = makeLevel(i);
    const L = CONFIG.levels[i];
    $("introEyebrow").textContent = `Уровень ${i + 1} из 4`;
    $("introTitle").textContent = L.title;
    $("introText").textContent = L.text;
    $("introHint").textContent = L.hint;
    hideOverlays(); show("hud", false); show("introScreen", true);
    $("introBtn").focus({ preventScroll: true });
  }
  function levelDone() {
    sfx.level();
    if (G.level < 3) showIntro(G.level + 1);
  }
  function fail() {
    state = "over"; G.fails[G.level]++;
    G.gifts = G.giftsAtStart; renderCount();
    const L = CONFIG.levels[G.level].title;
    $("overText").textContent = G.fails[G.level] >= 2
      ? `${L} сегодня злой. Даю 5 жизней, должно хватить.`
      : `${L} пока не сдался. Повтори уровень, прогресс по остальным сохранён.`;
    show("overScreen", true);
  }
  function win() {
    state = "win"; sfx.win(); show("hud", false);
    $("stat").textContent = `Подарков по дороге: ${G.gifts}`;
    show("winScreen", true); startConfetti();
  }

  $("startBtn").addEventListener("click", () => { G.gifts = 0; G.fails = [0, 0, 0, 0]; showIntro(0); });
  $("introBtn").addEventListener("click", () => startLevel(G.level));
  $("retryBtn").addEventListener("click", () => startLevel(G.level));
  $("againBtn").addEventListener("click", () => { stopConfetti(); G.gifts = 0; G.fails = [0, 0, 0, 0]; showIntro(0); });


  /* ---------- ввод ---------- */
  function down() { audioCtx(); pressed = true; if (state === "play" && LV) LV.press(); }
  function up() { pressed = false; if (state === "play" && LV) LV.release(); }
  canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); down(); });
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
  window.addEventListener("blur", up);
  window.addEventListener("keydown", (e) => {
    if (e.code !== "Space" && e.code !== "ArrowUp" && e.code !== "KeyW") return;
    if (state === "play") { e.preventDefault(); if (!e.repeat) down(); }
  });
  window.addEventListener("keyup", (e) => { if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") up(); });

  /* ---------- конфетти ---------- */
  let conf = [], confOn = false;
  function startConfetti() {
    if (reduceMotion) return;
    confOn = true; conf = [];
    for (let i = 0; i < 160; i++) conf.push({ x: Math.random() * fx.width, y: -Math.random() * fx.height, vy: (2 + Math.random() * 3) * dpr, vx: (Math.random() - 0.5) * 2 * dpr, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, s: (5 + Math.random() * 6) * dpr, c: ["#e8443a", "#ffd23f", "#3a4f8a", "#7fb6e6", "#ffffff"][i % 5] });
  }
  function stopConfetti() { confOn = false; fctx.clearRect(0, 0, fx.width, fx.height); }
  function drawConfetti() {
    if (!confOn) return;
    fctx.clearRect(0, 0, fx.width, fx.height);
    for (const p of conf) {
      p.y += p.vy; p.x += p.vx + Math.sin(p.y / 40); p.r += p.vr;
      if (p.y > fx.height + 20) { p.y = -20; p.x = Math.random() * fx.width; }
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c; fctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fctx.restore();
    }
  }

  /* ---------- цикл ---------- */
  let last = performance.now(), menuD = 0;
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    G.t += dt;
    if (state === "play" && LV) { LV.update(dt); renderProgress(LV.progress()); }
    if (G.shake > 0) G.shake -= dt;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    if (G.shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6);
    if (state === "menu") { menuD += dt * 60; bgAsbest(menuD); }
    else if (LV) LV.draw();
    drawConfetti();
    requestAnimationFrame(frame);
  }
  document.addEventListener("visibilitychange", () => { last = performance.now(); if (document.hidden) up(); });
  requestAnimationFrame(frame);
})();
</script>
